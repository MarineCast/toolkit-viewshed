# Canonical OrcaCast observation-geometry viewshed configuration.
#
# This is the editable checkout copy of the default package configuration.

provenance:
  workflow: human.viewshed
  dataset_id: human.viewshed.static
  producer: human.viewshed

run:
  name: model_area_viewshed
  version: model_area_h3r7_30km_clearance30_v002
  overwrite: false
  skip_existing_partitions: true
  combine_final_parquet: false
  keep_intermediate_rasters: false
  keep_batch_intermediates: false
  write_geojson: false
  # Keep terrain debug maps off; export-static-maps owns the two canonical HTMLs.
  write_maps: false
  write_cumulative_rasters: false
  write_pair_geometry: false

# Resolve the canonical Campbell River-to-southwest-Washington modeling bbox
# from the packaged common.yaml. The modeled target domain extends beyond this source
# bbox by max_distance_m + aoi_margin_m.
area: model_area

region:
  name: model_area
  coastal_buffer_m: 6000
  min_source_cell_land_fraction: 0.01
  min_source_cell_water_fraction: 0.0
  max_source_cell_water_fraction: 0.95
  cleanup_natural_earth: false

viewshed:
  backend: gdal
  surface_model: bare_earth
  dem_resolution_m: 30
  crs_projected: EPSG:32610
  observer_eye_height_m: 1.7
  target_height_m: 1.0
  sea_level_m: 0.0
  # GDAL does not define LOS behavior through missing DEM cells. Observer
  # endpoints are validated first; all remaining gaps are conservative blockers.
  dem_nodata_policy: opaque_barrier
  dem_nodata_barrier_height_m: 100000.0
  max_distance_m: 30000
  aoi_margin_m: 1000
  curvature_coefficient: 0.85714
  earth_radius_m: 6378137.0
  # Retain the tallest CHM obstruction in each aligned pixel, but ground the
  # immediate 30 m observer neighborhood so a sampled viewpoint is not trapped
  # inside the canopy surface by its adjacent raster pixel.
  canopy_resampling: max
  canopy_nodata_policy: zero
  minimum_canopy_height_m: 0.0
  observer_canopy_clearance_radius_m: 30.0

h3:
  source_resolution: 7
  target_resolution: 7
  source_sampling_mode: active_fraction
  sample_points_per_source_cell: 10
  min_sample_points_per_source_cell: 5
  aggregation_mode: full
  pixel_stride: 1
  min_visible_sampled_pixel_count: 1
  min_visible_area_km2: 0.0
  include_centroid: true

batch:
  max_workers: 14
  batch_size_cells: 7
  # Per-source cumulative arrays are allocated lazily only for touched tiles.
  accumulator_tile_size: 512
  strategy: h3_parent
  max_batch_aoi_pixels: 20000000
  max_estimated_batch_memory_mb: 768

raster:
  intermediate_compress: none
  final_compress: deflate
  block_size: 512

distance_weight:
  version: distance_v001_slim_source_type_lookup
  selected_model: logistic
  logistic_d50_km: 9.0
  logistic_slope_km: 2.7
  normalize_at_zero: true
  hard_cutoff_km: 30.0
  source_chunk_size: 256
  overwrite: false
  compute_exact_p90: false
  p90_method: none

# Static map export is part of the viewshed package, not a notebook workflow.
# The configured point is converted to a source H3 cell at source_resolution.
static_maps:
  enabled: true
  selected_location:
    latitude: 48.135238
    longitude: -122.767230
  colormap_name: visibility_heat
  display_quantile: 0.98
  analysis_pixel_size_m: 250
  output_pixel_size_m: 100
  gaussian_sigma_km: 1.5
  support_boundary_smoothing_km: 0.45
  raster_padding_km: 3.0
  h3_fill_opacity: 0.78
  smoothed_fill_opacity: 0.82
  externalize_map_assets: true

source_target_lookup:
  max_distance_km_land: 30.0
  max_distance_km_water: 30.0
  include_land_sources: true
  include_water_sources: true
  include_mixed_as_land_sources: true
  include_mixed_as_water_sources: true
  include_water_targets: true
  include_mixed_as_water_targets: true
  allow_self_pairs: false
  allow_active_role_self_pairs: true
  strict_bbox_intersection: true

water_viewing:
  target_visibility_height_m: 1.5
  default_observer_height_class: small_craft
  target_area_equal_area_crs: EPSG:6933
  # Water sources use a dedicated land-mask LOS model: mapped land is fully
  # opaque, so no DEM or canopy raster is needed. Three deterministic samples
  # on each side retain partial coastal-cell support with at most nine rays.
  source_samples_per_cell: 3
  land_mask:
    land_buffer_m: 30
    target_samples_per_cell: 3
  observer_height_classes:
    small_craft:
      eye_height_m: 2.5
      description: Pleasure boats and fishing craft

# Canopy LOS is the production vegetation factor. Land-cover attenuation is a
# separate, opt-in pipeline and is not included in the terrain surface.
canopy:
  resolution_m: 10

canopy_visibility:
  contract: conditional_canopy_los_ratio_no_landcover_v1
  landcover_used: false

vegetation_data:
  bbox_buffer_deg: 0.02
  canopy:
    raw_dir: data/raw/canopy/eth_10m
    processed_dir: data/processed/domain/environmental_layer/landscape/CHM
    final_dir: data/processed/domain/environmental_layer/landscape/CHM
    tile_manifest_path: data/cache/chm_tile_manifest.json
    tile_index_url: https://langnico.github.io/globalcanopyheight/assets/tile_index.html
    download_std_layer: false
  landcover:
    method: aws
    temp_dir: data/_tmp/landcover
    raw_dir: data/raw/landcover/esa_worldcover_v200
    final_dir: data/processed/domain/environmental_layer/landscape/LAND_COVER
    output_path: data/_tmp/landcover/esa_worldcover_v200_landcover_clip.tif
    metadata_path: data/processed/domain/environmental_layer/landscape/LAND_COVER/LAND_COVER_METADATA.json
    cache_dir: data/cache
    tile_manifest_path: data/cache/landcover_tile_manifest.json
    land_cover_10m_filename: LAND_COVER_10M.tif
    land_cover_30m_filename: LAND_COVER_30M.tif
    resampling: nearest
    worldcover_s3_uri: s3://esa-worldcover/v200/2021/map
  class_lookup_path: data/processed/domain/environmental_layer/landscape/LAND_COVER/LAND_COVER_CLASS_LOOKUP.csv

vegetation_weights:
  resolution_m: 30

paths:
  # Reuse the existing regional inputs. These cover the complete model_area.
  water_polygon_path: data/processed/domain/environmental_layer/seascape/spatial_support/water_geometry/TERRITORIAL_WATER_POLYGON.parquet
  land_polygon_path: data/raw/gis/land/ne_10m_land.shp
  raw_dem_dir: data/tmp/elevation
  regional_dem_path: data/processed/domain/environmental_layer/landscape/DEM/DEM_30M.tif
  canopy_height_path: data/processed/domain/environmental_layer/landscape/CHM/CHM_30M.tif
  # Rebuildable stage data lives outside the durable processed-data contract.
  # A successful complete build removes this working directory.
  output_dir: data/tmp/viewshed/h3r7
  # The durable viewshed contract contains only the two final static tables.
  final_output_dir: data/processed/domain/human/viewshed/RES7
  # Static-map export appends h3r{source_resolution}/static.
  map_dir: outputs/effort/viewshed
  source_cells_path: data/tmp/viewshed/h3r7/inputs/land_h3.parquet
  land_h3_path: data/tmp/viewshed/h3r7/inputs/land_h3.parquet
  projected_dem_path: data/tmp/viewshed/h3r7/cache/projected_dem.tif
  final_visibility_path: data/tmp/viewshed/h3r7/terrain/terrain_visibility.parquet
  partitioned_visibility_dir: data/tmp/viewshed/h3r7/terrain/partitions
  manifest_path: data/tmp/viewshed/h3r7/terrain/manifest.csv

# Consumer settings live with the model so publishing cannot drift onto a
# different source-target universe or set of factor artifacts.
publishing:
  viewability:
    h3_boundaries: data/processed/domain/environmental_layer/seascape/spatial_support/h3_geometry/H3_GRIDS_CLIPPED_7.parquet
    weather_daily: null
    daylight_daily: data/processed/domain/environmental_layer/meteorological/daylight/H3_DAYLIGHT_DAILY_RES_4/year=*/*.parquet
    lunar_daily: data/processed/domain/environmental_layer/meteorological/lunar/H3_LUNAR_DAILY_RES_5/year=*/*.parquet
    start_date: "2020-01-01"
    end_date: "2026-06-25"
    target_resolution: 7
    source_resolution: 7
    source_visibility_bundle_size_sources: 25
    source_timeseries_bundle_size_sources: 25
    parallel_workers: 8
    min_source_target_weight: 0.001
    base_only: false
    dynamic_only: false
