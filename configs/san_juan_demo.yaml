# Small real-data documentation demo. Run scripts/run_san_juan_demo.py.
provenance:
  workflow: human.viewshed
  dataset_id: human.viewshed.static
  producer: human.viewshed
run:
  name: san_juan_demo
  version: san_juan_demo_r7_100m_v1
  overwrite: false
  skip_existing_partitions: true
  combine_final_parquet: false
  keep_intermediate_rasters: false
  keep_batch_intermediates: false
  write_geojson: false
  write_maps: false
  write_cumulative_rasters: false
  write_pair_geometry: false
datasets:
  dem:
    provider: usgs_3dep
    enabled: true
    resolution_m: 30
    version: live
    cache: true
  chm:
    provider: local
    resolution_m: 10
    version: ETH_2020_window_v1
    assets:
    - data/san_juan_demo/raw/chm/N48W126.tif
    - data/san_juan_demo/raw/chm/N48W123.tif
composition:
  model: distance_integrated_los
  land:
  - terrain
  - canopy
  water:
  - terrain
region:
  name: central_san_juan_islands
  coastal_buffer_m: 6000
  min_source_cell_land_fraction: 0.01
  min_source_cell_water_fraction: 0.0
  max_source_cell_water_fraction: 0.95
  cleanup_natural_earth: false
viewshed:
  backend: gdal
  surface_model: bare_earth
  dem_resolution_m: 100
  crs_projected: EPSG:32610
  observer_eye_height_m: 1.7
  target_height_m: 1.0
  sea_level_m: 0.0
  dem_nodata_policy: opaque_barrier
  dem_nodata_barrier_height_m: 100000.0
  max_distance_m: 5000
  aoi_margin_m: 1000
  curvature_coefficient: 0.85714
  earth_radius_m: 6378137.0
  canopy_resampling: max
  canopy_nodata_policy: zero
  minimum_canopy_height_m: 0.0
  observer_canopy_clearance_radius_m: 100
h3:
  source_resolution: 7
  target_resolution: 7
  source_sampling_mode: active_fraction
  sample_points_per_source_cell: 3
  min_sample_points_per_source_cell: 1
  aggregation_mode: full
  pixel_stride: 1
  min_visible_sampled_pixel_count: 1
  min_visible_area_km2: 0.0
  include_centroid: true
batch:
  max_workers: 2
  batch_size_cells: 7
  accumulator_tile_size: 512
  strategy: h3_parent
  max_batch_aoi_pixels: 20000000
  max_estimated_batch_memory_mb: 768
raster:
  intermediate_compress: none
  final_compress: deflate
  block_size: 512
distance_weight:
  version: distance_v001_slim_source_type_lookup
  selected_model: logistic
  logistic_d50_km: 2.5
  logistic_slope_km: 0.8
  normalize_at_zero: true
  hard_cutoff_km: 5
  source_chunk_size: 256
  overwrite: false
  compute_exact_p90: false
  p90_method: none
static_maps:
  enabled: true
  selected_location:
    latitude: 48.535
    longitude: -123.015
  colormap_name: visibility_heat
  display_quantile: 0.98
  analysis_pixel_size_m: 100
  output_pixel_size_m: 100
  gaussian_sigma_km: 0.15
  support_boundary_smoothing_km: 0.1
  raster_padding_km: 3.0
  h3_fill_opacity: 0.78
  smoothed_fill_opacity: 0.82
  externalize_map_assets: false
source_target_lookup:
  max_distance_km_land: 5
  max_distance_km_water: 5
  include_land_sources: true
  include_water_sources: true
  include_mixed_as_land_sources: true
  include_mixed_as_water_sources: true
  include_water_targets: true
  include_mixed_as_water_targets: true
  allow_self_pairs: false
  allow_active_role_self_pairs: true
  strict_bbox_intersection: true
water_viewing:
  target_visibility_height_m: 1.5
  default_observer_height_class: small_craft
  target_area_equal_area_crs: EPSG:6933
  source_samples_per_cell: 3
  land_mask:
    land_buffer_m: 30
    target_samples_per_cell: 3
  observer_height_classes:
    small_craft:
      eye_height_m: 2.5
      description: Pleasure boats and fishing craft
canopy:
  resolution_m: 10
canopy_visibility:
  contract: conditional_canopy_los_ratio_no_landcover_v1
  landcover_used: false
vegetation_weights:
  resolution_m: 30
paths:
  land_polygon_path: data/san_juan_demo/raw/land/ne_10m_land.shp
  water_polygon_path: data/san_juan_demo/prepared/water.parquet
  raw_dem_dir: data/san_juan_demo/raw/dem
  regional_dem_path: data/san_juan_demo/prepared/dem_100m.tif
  canopy_height_path: data/san_juan_demo/prepared/chm_100m.tif
  output_dir: data/san_juan_demo/work
  final_output_dir: data/san_juan_demo/outputs
  map_dir: data/san_juan_demo/maps
  source_cells_path: data/san_juan_demo/work/inputs/land_h3.parquet
  land_h3_path: data/san_juan_demo/work/inputs/land_h3.parquet
  projected_dem_path: data/san_juan_demo/work/cache/projected_dem_demo.tif
  final_visibility_path: data/san_juan_demo/work/terrain/terrain_visibility.parquet
  partitioned_visibility_dir: data/san_juan_demo/work/terrain/partitions
  manifest_path: data/san_juan_demo/work/terrain/manifest.csv
bbox_wgs84:
  min_lon: -123.2
  min_lat: 48.46
  max_lon: -122.9
  max_lat: 48.64
case_study:
  name: san_juan_demo
  analysis_root: analysis
  data_root: data
