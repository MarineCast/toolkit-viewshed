[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viewshed-toolkit"
version = "0.1.0"
description = "Python toolkit for reproducible geospatial viewshed and visibility modeling, including terrain preprocessing, observer geometry, spatial aggregation, validation, and analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tyler Stevenson" }
]

dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "rasterio",
    "xarray",
    "pyproj",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "jupyter",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
