[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viewshed-toolkit"
version = "0.1.0"
description = "Python toolkit for reproducible geospatial viewshed and visibility modeling, including terrain preprocessing, observer geometry, spatial aggregation, validation, and analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tyler Stevenson" }
]

dependencies = [
    "affine>=2.4",
    "branca>=0.8",
    "folium>=0.20",
    "geopandas>=1.0",
    "h3>=4.0",
    "matplotlib>=3.8",
    "numba>=0.60",
    "numpy>=1.26",
    "pandas>=2.1",
    "Pillow>=10.0",
    "polars>=1.0",
    "psutil>=5.9",
    "pydantic>=2.0",
    "pyarrow>=14",
    "pyproj>=3.6",
    "PyYAML>=6.0",
    "rasterio>=1.4",
    "requests>=2.31",
    "scipy>=1.11",
    "shapely>=2.0",
    "tqdm>=4.66",
    "xarray>=2024.1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "jupyter",
    "ipykernel"
]
acquisition = [
    "py3dep",
    "rioxarray",
    "xarray-spatial"
]
analysis = [
    "plotly>=5.24"
]

[project.scripts]
viewshed-toolkit = "viewshed_toolkit.pipeline.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"viewshed_toolkit.resources" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F401", "F811", "F841"]

[tool.black]
line-length = 100
