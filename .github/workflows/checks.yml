name: Package and scientific contracts
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geospatial:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/environment.yml
          create-args: python=${{ matrix.python }}
          cache-environment: true
      - run: python -m pip install -e '.[dev,analysis]'
      - run: viewshed-toolkit --help
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: python scripts/check_components.py
      - run: python -m compileall -q src
      - run: python scripts/check_installed_wheel.py
  documentation:
    uses: ./.github/workflows/docs-quality.yml
