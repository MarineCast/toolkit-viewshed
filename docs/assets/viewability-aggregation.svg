<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Read the same pair records in either direction"><title>Read the same pair records in either direction</title><rect width="1000" height="420" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#243e48"><text x="35" y="50" font-size="27" font-weight="700">Read the same pair records in either direction</text><rect x="35" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="50" y="135" font-size="21" font-weight="600">Forward question</text><text x="50" y="175" font-size="16">Fix an observer area</text><text x="50" y="204" font-size="16">Query its included water targets</text><text x="327" y="195" font-size="30">→</text><rect x="360" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="375" y="135" font-size="21" font-weight="600">Canonical pair record</text><text x="375" y="175" font-size="16">Role + source + target + run</text><text x="375" y="204" font-size="16">Exactly one modeled value</text><text x="652" y="195" font-size="30">→</text><rect x="685" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="700" y="135" font-size="21" font-weight="600">Inverse question</text><text x="700" y="175" font-size="16">Fix a water target area</text><text x="700" y="204" font-size="16">Query included source areas</text><text x="35" y="305" font-size="18">Forward and inverse are indexes, not independently calculated kernels.</text><text x="35" y="337" font-size="18">Source counts describe modeled areas, not actual observers or boats.</text><text x="35" y="369" font-size="18">Results preserve source role, modeled zeros, unavailable data and candidate support.</text></g></svg>
