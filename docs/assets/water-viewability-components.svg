<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Water-source support: opaque land, integrated distance"><title>Water-source support: opaque land, integrated distance</title><rect width="1000" height="420" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#243e48"><text x="35" y="50" font-size="27" font-weight="700">Water-source support: opaque land, integrated distance</text><rect x="35" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="50" y="135" font-size="21" font-weight="600">Water sample design</text><text x="50" y="175" font-size="16">Source and target water samples</text><text x="50" y="204" font-size="16">Separate water-source role</text><text x="327" y="195" font-size="30">→</text><rect x="360" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="375" y="135" font-size="21" font-weight="600">Opaque-land LOS</text><text x="375" y="175" font-size="16">Land blocks water sightlines</text><text x="375" y="204" font-size="16">Distance applied to each path</text><text x="652" y="195" font-size="30">→</text><rect x="685" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="700" y="135" font-size="21" font-weight="600">Water kernel</text><text x="700" y="175" font-size="16">W_water = mean(LOS × D)</text><text x="700" y="204" font-size="16">Canopy: not applicable</text><text x="35" y="305" font-size="18">The centroid-distance diagnostic is not another multiplier.</text><text x="35" y="337" font-size="18">No shoreline-canopy factor is modeled for this source role.</text><text x="35" y="369" font-size="18">Physical support is separate from actual boats, effort, sightings and detection.</text></g></svg>
