<path d="M260 285H455V320H260Z" fill="#b4d9df"/>
<g transform="translate(62 190)" fill="#253f46" stroke="#253f46" stroke-width="4" stroke-linecap="round"><circle cy="-33" r="6"/><path d="M0-26v15m0-12 11-7m-11 19-7 11m7-11 7 11" fill="none"/></g>
<path d="M209 231V144" stroke="#735e40" stroke-width="6"/>
<path d="M209 118L174 181H188L169 208H250L231 181H244Z" fill="#759c75"/>
<path d="M65 157L190 198" stroke="#bd562d" stroke-width="3"/><path d="M190 198L430 278" stroke="#bd562d" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="190" cy="198" r="7" fill="none" stroke="#bd562d" stroke-width="3"/>
