<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="title desc">
<title id="title">Tree height can interrupt a ground-clear sightline</title><desc id="desc">A person looks across a slope to water. The ray clears bare ground but crosses a tree crown when vegetation is included. Schematic; not a Lime Kiln model result.</desc>
