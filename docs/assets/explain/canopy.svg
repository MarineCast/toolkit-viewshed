<style>text{font:18px system-ui,sans-serif;fill:#253f46}.title{font-size:22px;font-weight:650}.small{font-size:16px}</style>
<text x="24" y="34" class="title">02 / Trees raise the surface</text>
<text x="24" y="69">Same ground. A different obstruction.</text>
