<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 435" role="img" aria-labelledby="title desc"><title id="title">Support decreases with distance under an assumed curve</title><desc id="desc">A person looks over water toward increasingly distant markers. Below, the normalized San Juan logistic curve declines from 1 at zero kilometres to about 0.044 at five kilometres, then drops to zero beyond the hard cutoff. It is not a detection probability.</desc><rect width="480" height="435" rx="12" fill="#f3f6f1"/><style>text{font:18px system-ui,sans-serif;fill:#253f46}.small{font-size:16px}.title{font-size:22px;font-weight:650}</style><text x="24" y="34" class="title">03 / A clear view can still be distant</text><path d="M25 129H110V155H25Z" fill="#c5c0ad"/><path d="M110 129H455V155H110Z" fill="#b4d9df"/><g transform="translate(61 129)" fill="#253f46" stroke="#253f46" stroke-width="4" stroke-linecap="round"><circle cy="-33" r="6"/><path d="M0-26v15m0-12 11-7m-11 19-7 11m7-11 7 11" fill="none"/></g><path d="M66 96L170 124" stroke="#087c6c" stroke-width="2" opacity="1"/><circle cx="170" cy="124" r="5" fill="#087c6c" opacity="1"/><path d="M66 96L300 124" stroke="#087c6c" stroke-width="2" opacity="0.55"/><circle cx="300" cy="124" r="5" fill="#087c6c" opacity="0.55"/><path d="M66 96L430 124" stroke="#087c6c" stroke-width="2" opacity="0.2"/><circle cx="430" cy="124" r="5" fill="#087c6c" opacity="0.2"/><text x="24" y="181" class="small">Assumed distance weight</text><path d="M55 195H445" stroke="#d4ddd6"/><text x="43" y="200" text-anchor="end" class="small">1</text><path d="M55 267.5H445" stroke="#d4ddd6"/><text x="43" y="272.5" text-anchor="end" class="small">0.5</text><path d="M55 340H445" stroke="#d4ddd6"/><text x="43" y="345" text-anchor="end" class="small">0</text><polyline points="55.00,195.00 56.62,195.19 58.25,195.39 59.88,195.60 61.50,195.81 63.12,196.02 64.75,196.25 66.38,196.48 68.00,196.71 69.62,196.96 71.25,197.20 72.88,197.46 74.50,197.72 76.12,198.00 77.75,198.