<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Correct land viewability composition"><title>Land support: integrated ground kernel times conditional canopy retention</title><rect width="1000" height="500" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#233d49"><text x="45" y="55" font-size="29" font-weight="700">Land viewing support: distance enters once</text><rect x="45" y="100" width="420" height="150" rx="10" fill="#e5f0f4"/><text x="70" y="135" font-size="23">Ground + distance support</text><text x="70" y="177" font-size="21">K_bare = mean(LOS_bare × D)</text><text x="70" y="214" font-size="17">Matched observer and target population</text><rect x="535" y="100" width="420" height="150" rx="10" fill="#e7f4ef"/><text x="560" y="135" font-size="23">Retained after vegetation</text><text x="560" y="177" font-size="21">C_D = min(K_canopy, K_bare) / K_bare</text><text x="560" y="214" font-size="17">Conditional ratio when K_bare is positive</text><text x="488" y="181" font-size="34">×</text><rect x="220" y="290" width="560" height="82" rx="10" fill="#cfe9f0"/><text x="252" y="342" font-size="25">Combined modeled support: W = K_bare × C_D</text><text x="45" y="410" font-size="19">The centroid-distance diagnostic is not another multiplier.</text><text x="45" y="444" font-size="17">Unweighted bare and canopy LOS are directly measured model summaries: J_bare and J_canopy.</text><text x="45" y="476" font-size="17">K_bare = 0: neutral canopy factor, no baseline support; not proof of transparent vegetation.</text></g></svg>
