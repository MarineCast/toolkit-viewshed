<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Static physical support: role-specific kernels"><title>Static physical support: role-specific kernels</title><rect width="1000" height="420" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#243e48"><text x="35" y="50" font-size="27" font-weight="700">Static physical support: role-specific kernels</text><rect x="35" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="50" y="135" font-size="21" font-weight="600">Real mapped inputs</text><text x="50" y="175" font-size="16">Ground, canopy, land and water</text><text x="50" y="204" font-size="16">Explicit missing-data policies</text><text x="327" y="195" font-size="30">→</text><rect x="360" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="375" y="135" font-size="21" font-weight="600">Matched model populations</text><text x="375" y="175" font-size="16">Land: bare and canopy LOS</text><text x="375" y="204" font-size="16">Water: opaque-land LOS</text><text x="652" y="195" font-size="30">→</text><rect x="685" y="100" width="280" height="160" rx="8" fill="#e6f1f4"/><text x="700" y="135" font-size="21" font-weight="600">Durable pair results</text><text x="700" y="175" font-size="16">Land: K_bare × C_D</text><text x="700" y="204" font-size="16">Water: integrated water kernel</text><text x="35" y="305" font-size="18">Distance is integrated once inside the LOS aggregation.</text><text x="35" y="337" font-size="18">Unweighted LOS is measured directly; conditional canopy retention is distance weighted.</text><text x="35" y="369" font-size="18">Source area × water target area × role, separate from sightings and observer activity.</text></g></svg>
