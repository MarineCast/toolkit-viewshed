site_name: Viewshed Toolkit
site_url: https://marinecast.github.io/toolkit-viewshed/
site_description: Static physical viewing support over land and water
repo_name: MarineCast/toolkit-viewshed
repo_url: https://github.com/MarineCast/toolkit-viewshed
edit_uri: edit/main/docs/
copyright: Copyright MarineCast contributors · Apache-2.0 software license
use_directory_urls: true
theme:
  name: material
  font: false
  icon:
    logo: material/binoculars
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
nav:
  - Overview: index.md
  - How it works:
      - Sightlines, trees and distance: understand/index.md
      - Method overview: methodology.md
  - Get started:
      - Installation: getting-started/installation.md
      - Your first result: getting-started/quick-start.md
      - Run the San Juan model: san-juan-demo.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Examples:
      - Visual walkthrough: examples.md
      - Everett port area: examples-everett.md
      - Larrabee woods: examples-larrabee.md
      - Putting it all together: examples-region.md
      - A sightline in detail: sightline-details.md
      - Completed regional viewshed: regional-viewshed-example.md
  - Outputs:
      - Read a result: products/index.md
      - Artifact dictionary: products/artifacts.md
      - Distance products: distance-products.md
  - Reference:
      - Scientific contracts: scientific-methodology.md
      - Configuration: configuration.md
      - Python and CLI: api.md
      - Pipeline stages: pipelines.md
      - Data sources: data-acquisition.md
      - San Juan dataset card: dataset-card.md
      - Salish Sea case study: salish-sea-case-study.md
      - Performance: performance.md
      - Development:
          - Contributing and validation: development/index.md
          - Architecture: architecture.md
          - Rebuild documentation examples: documentation-examples.md
          - Validation evidence: development/evidence.md
          - Acceptance and releases: development/acceptance.md
not_in_nav: |
  reports/**
  workflows/index.md
  api/overview.md
  development/lime-kiln-validation.md
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/extra.css
  - assets/examples/examples.css
  - assets/examples/regional/explorer.css
hooks:
  - scripts/docs_hooks.py
extra_javascript:
  - assets/examples/explorer.js
  - assets/examples/regional/explorer.js
