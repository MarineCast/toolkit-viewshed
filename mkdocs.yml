site_name: Viewshed Toolkit
site_url: https://marinecast.github.io/toolkit-viewshed/
site_description: Static physical viewing support over land and water
repo_name: MarineCast/toolkit-viewshed
repo_url: https://github.com/MarineCast/toolkit-viewshed
edit_uri: edit/main/docs/
copyright: Copyright MarineCast contributors · Apache-2.0 software license
use_directory_urls: true
theme:
  name: material
  font: false
  icon:
    logo: material/binoculars
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Understand:
      - Viewing concepts: understand/index.md
      - Method overview: methodology.md
      - Data sources: data-acquisition.md
      - San Juan dataset card: dataset-card.md
  - Products:
      - Product guide: products/index.md
      - Artifact dictionary: products/artifacts.md
      - Distance products: distance-products.md
  - Examples:
      - One sightline to regional support: examples.md
      - Choose a workflow: workflows/index.md
      - San Juan model setup: san-juan-demo.md
      - Salish Sea case study: salish-sea-case-study.md
  - API:
      - API overview: api/overview.md
      - Python and CLI: api.md
  - Reference:
      - Scientific contracts: scientific-methodology.md
      - Configuration: configuration.md
      - Pipeline stages: pipelines.md
      - Performance: performance.md
  - Development:
      - Contributing and validation: development/index.md
      - Architecture: architecture.md
      - Reproduce the example: documentation-examples.md
      - Validation evidence: development/evidence.md
      - Acceptance and releases: development/acceptance.md
not_in_nav: |
  reports/**
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/extra.css
  - assets/examples/examples.css
hooks:
  - scripts/docs_hooks.py
extra_javascript:
  - assets/examples/explorer.js
